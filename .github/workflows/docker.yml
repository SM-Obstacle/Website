name: Docker image

# Image tags:
# - push on master        -> <version>-<sha7>   (e.g. 1.0.0-abc1234)
# - push of a tag vX.Y.Z  -> X.Y.Z              (X.Y.Z must match "version" in package.json)
#                            + latest, only if it's the highest vX.Y.Z tag of the repo
#                              (tagging an older version later doesn't move latest back;
#                              pre-releases like v1.1.0-rc1 never get latest)
#
# - pull request on master -> build only, nothing is pushed
#
# The image is multi-arch (linux/amd64 + linux/arm64). Each platform is built natively on
# its own runner, then both are merged into a single manifest that carries the tags.
#
# For a release tag, the image already built from master for that commit is re-tagged
# (same bits as what was deployed/tested). It is only rebuilt if that image doesn't exist.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: ["master"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # Computes the image name and tags, and handles the re-tag of a release
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.pkg.outputs.image }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      retagged: ${{ steps.retag.outputs.done }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The image is named after the repository: ghcr.io/<owner>/<repo>
      # (ghcr.io requires lowercase names). The version comes from package.json.
      - name: Read image name and version
        id: pkg
        run: |
          version=$(jq -r '.version // empty' package.json)
          if [ -z "$version" ]; then
            echo "::error::package.json must have a \"version\""
            exit 1
          fi
          # Docker tags only allow [A-Za-z0-9_.-] (no "+" build metadata)
          if ! [[ "$version" =~ ^[0-9A-Za-z_.-]+$ ]]; then
            echo "::error::Version \"$version\" can't be used as a Docker tag"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version ($version). Expected v$version."
            exit 1
          fi
          # latest only goes to the highest final release (X.Y.Z, no pre-release suffix)
          latest=false
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            highest=$(git ls-remote --tags --refs origin 'v*' \
              | sed 's#.*refs/tags/v##' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -t. -k1,1n -k2,2n -k3,3n \
              | tail -n 1)
            if [ "$highest" = "$version" ]; then
              latest=true
            else
              echo "::notice::v$version is not the highest release (v$highest), latest is left unchanged"
            fi
          fi
          image=$(echo "${REGISTRY}/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          {
            echo "image=$image"
            echo "latest=$latest"
            echo "version=$version"
            echo "sha=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"


      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.pkg.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.pkg.outputs.version }}-${{ steps.pkg.outputs.sha }},enable=${{ github.ref_type == 'branch' }}
            type=raw,value=${{ steps.pkg.outputs.version }},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ steps.pkg.outputs.latest == 'true' }}

      - name: Set up Docker Buildx
        if: github.ref_type == 'tag'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Copies the whole multi-arch manifest built from master for this commit
      - name: Re-tag the image built from master
        id: retag
        if: github.ref_type == 'tag'
        env:
          SOURCE: ${{ steps.pkg.outputs.image }}:${{ steps.pkg.outputs.version }}-${{ steps.pkg.outputs.sha }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if ! docker buildx imagetools inspect "$SOURCE" > /dev/null 2>&1; then
            echo "::notice::$SOURCE not found, building the image instead"
            exit 0
          fi
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$SOURCE"
          echo "done=true" >> "$GITHUB_OUTPUT"

  # Builds each platform natively and pushes it by digest (no tag yet)
  build:
    needs: prepare
    if: needs.prepare.outputs.retagged != 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            pair: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            pair: linux-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.prepare.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_RECORDS_API_URL=${{ vars.NEXT_PUBLIC_RECORDS_API_URL }}
            WEBSITE_PORT=${{ vars.WEBSITE_PORT || '8000' }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.pair }}
          cache-to: type=gha,scope=${{ matrix.pair }},mode=max

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Creates the multi-arch manifest from both digests and applies the tags
  merge:
    needs: [prepare, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "$TAGS"
          sources=()
          for digest in *; do
            sources+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"

      - name: Inspect the image
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: docker buildx imagetools inspect "$(head -n 1 <<< "$TAGS")"
