name: Docker image

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The image is named after "name" in package.json: ghcr.io/<owner>/<name>
      # (ghcr.io requires lowercase names)
      - name: Read image name from package.json
        id: pkg
        run: |
          name=$(jq -r '.name' package.json)
          if [ -z "$name" ] || [ "$name" = "null" ]; then
            echo "::error::No \"name\" field in package.json"
            exit 1
          fi
          image=$(echo "${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/${name}" | tr '[:upper:]' '[:lower:]')
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.pkg.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_RECORDS_API_URL=${{ vars.NEXT_PUBLIC_RECORDS_API_URL }}
            WEBSITE_PORT=${{ vars.WEBSITE_PORT || '8000' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
